name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
      - name: Run tests
        run: pytest -q   # model + Claude tests auto-skip without their flags/keys

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test        # vitest (notation logic)
      - run: npm run build   # tsc typecheck + vite bundle
